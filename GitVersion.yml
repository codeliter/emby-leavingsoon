mode: Mainline
major-version-bump-message: "^(breaking|major)"
minor-version-bump-message: "^(feat|feature|add)"
patch-version-bump-message: "^(fix|patch|chore|docs|refactor|build|ci)"
no-bump-message: "^(norelease|skip)"
branches:
  main:
    regex: ^main$
    label: ''
    increment: Patch
    prevent-increment-of-merged-branch-version: true
    track-merge-target: false
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    label: PullRequest
    increment: Inherit
